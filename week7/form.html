<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/formstyle.css">
</head>

<body>
    <div class="container">
        <h1>Registration form</h1>
        <!--<div class="input-container">
    <input type="text" id="first-name" class="input-field" placeholder=" ">
    
</div>-->
        <form action="">
            <div class="name">
                <div class="input-container">
                    <input type="text" name="input-field" id="fname" placeholder="First Name" required>
                    <label for="fname" class="input-label">First name*</label>
                    <input type="text" name="input-field" id="lname" placeholder="Last Name" required>
                    <label for="lname" class="input-label">Last name*</label>
                </div>
            </div>
            <br>
            <div>
                <input type="date" name="dob" id="dob" placeholder="Date of Birth" required>
            </div>
            <br>
            <div>
                <input type="email" name="cusemail" id="cusemail" placeholder="Email Address" required>
            </div>
            <br>
            <div>
                <input type="url" name="hpurl" id="hpurl" placeholder="Home Page URL">
            </div>
            <br>
            <div class="favcolor">
                <label for="favcolor">Favourite Colour</label>
                <input type="color" name="favcolor" id="favcolor">
            </div>
            <br>
            <div>
                <input type="textarea" name="bio" id="bio" placeholder="Bio / Self-Introduction">
            </div>
            <input type="submit">

        </form>
    </div>
</body>

</html>
