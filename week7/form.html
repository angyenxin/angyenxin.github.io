<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="./css/formstyle.css">
</head>

<body>
    <div class="container">
        <h1>Registration form</h1>
        <form action="">

            <div class="name">
                <div class="input-container">
                    <input type="text" id="fname" class="input-field" placeholder=" " required>
                    <label for="fname" class="input-label">First name*</label>
                </div>
                <div class="input-container">
                    <input type="text" id="lname" class="input-field" placeholder=" " required>
                    <label for="lname" class="input-label">Last name*</label>
                </div>
            </div>

            <br>

            <div class="input-container">
                <input type="date" id="dob" class="input-field" placeholder="" required>
                <label for="dob" class="input-label">Date of Birth*</label>
            </div>
            <br>

            <div class="input-container">
                <input type="email" class="input-field" id="cusemail" placeholder="" required>
                <label for="cusemail" class="input-label">Email Address*</label>
            </div>

            <br>
            <div class="input-container">
                <input type="url" class="input-field" id="hpurl" placeholder="">
                <label for="hpurl" class="input-label">Homepage URL</label>
            </div>
            <br>

            <div class="input-container">
                <div class="favcolor">
                    <label for="favcolor" class="labelfavcolor">Favourite Colours</label>
                    <input type="color" class="input-field" id="favcolor">
                </div>
            </div>

            <br>

            <div class="input-container">
                <input type="textarea" class="input-field" id="bio" placeholder="">
                <label for="bio" class="input-label">Bio</label>
            </div>
            <br>
            <input class="submit" type="submit">

        </form>
    </div>
</body>

</html>
